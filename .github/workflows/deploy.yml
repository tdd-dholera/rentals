name: Deploy Next.js

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

        env:
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}

      - name: Prepare standalone output
        run: |
          mkdir -p .next/standalone/.next

          rm -rf .next/standalone/.next/static
          cp -r .next/static .next/standalone/.next/static

          rm -rf .next/standalone/public
          mkdir -p .next/standalone/public
          cp -r public/. .next/standalone/public/

          rm -rf .next/standalone/.next/cache

      - name: Archive build output
        run: |
          tar \
            --exclude='.next/standalone/.next/cache' \
            -czf app.tar.gz \
            .next/standalone \
            package.json

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "app.tar.gz"
          target: "/var/www/rentalsindholera"
          overwrite: true

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TELECRM_API_KEY: ${{ secrets.TELECRM_API_KEY }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: TELECRM_API_KEY
          script: |
            set -e

            echo "Current SSH user:"
            whoami

            CURRENT_USER="$(whoami)"
            USER_HOME="$(getent passwd "$CURRENT_USER" | cut -d: -f6)"

            echo "Detected home directory:"
            echo "$USER_HOME"

            export NVM_DIR="$USER_HOME/.nvm"

            echo "Checking NVM"

            if [ ! -f "$NVM_DIR/nvm.sh" ]; then
              echo "ERROR: NVM not found"
              echo "Expected location: $NVM_DIR/nvm.sh"
              echo "Current user: $CURRENT_USER"
              echo "Home directory: $USER_HOME"
              exit 1
            fi

            . "$NVM_DIR/nvm.sh"

            echo "Runtime versions"

            node -v
            npm -v
            pm2 -v

            echo "Node path:"
            which node

            echo "PM2 path:"
            which pm2

            echo "Opening project directory"

            cd /var/www/rentalsindholera

            echo "Extracting new build"

            tar -xzf app.tar.gz

            rm -rf .next/standalone/.next/cache

            echo "Checking standalone server"

            if [ ! -f ".next/standalone/server.js" ]; then
              echo "ERROR: .next/standalone/server.js not found"
              exit 1
            fi

            export HOSTNAME=127.0.0.1
            export PORT=3000
            export TELECRM_API_KEY="$TELECRM_API_KEY"

            echo "Starting or restarting application"

            if pm2 describe rentalsindholera > /dev/null 2>&1; then
              pm2 restart rentalsindholera --update-env
            else
              pm2 start .next/standalone/server.js --name rentalsindholera
            fi

            echo "Saving PM2 process"

            pm2 save
            echo "PM2 status"

            pm2 list

            echo "Waiting for application startup"

            sleep 3

            echo "Testing Next.js locally"

            curl -I http://127.0.0.1:3000 || true

            echo "Testing live domain"

            curl -I https://www.rentalsindholera.com || true
